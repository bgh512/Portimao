name: Mac problem
description: Portimao does not start on a Mac.
title: 'Mac: '
body:
  - type: markdown
    attributes:
      value: |
        Sorry that Portimao does not start. If you have not yet, look for what you see in [If Portimao does not start on a Mac](https://github.com/bgh512/Portimao#23-if-portimao-does-not-start-on-a-mac): most problems are solved there in a minute.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw, with any message word for word. A screenshot helps (Cmd + Shift + 4, drag over the message, then drag the picture from the Desktop into this box).
    validations:
      required: true
  - type: textarea
    id: what-tried
    attributes:
      label: What you tried
      description: The entries of the Mac help you tried, and what each one changed.
  - type: textarea
    id: mac-report
    attributes:
      label: The Mac report
      description: If Portimao showed a Copy details button, click it and the report is copied. Otherwise open Terminal (Cmd + Space, type Terminal, press Enter), paste the line sh ~/Applications/Portimao.app/Contents/Resources/launchers/mac_report.sh and press Enter (leave out the ~ if you put Portimao in the main Applications folder yourself; on a Mac older than macOS 14 the line is sh ~/Portimao/launchers/mac_report.sh). The report is copied by itself, so click here and paste it (Cmd + V). It shows where Portimao is, which includes your Mac user name; change it before sending if you prefer.
      render: text
    validations:
      required: true
