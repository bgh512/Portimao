name: Mac problem
description: Portimao does not start on a Mac.
title: 'Mac: '
body:
  - type: markdown
    attributes:
      value: |
        Sorry that Portimao does not start. If you have not yet, look for what you see in [If Portimao does not start on a Mac](https://github.com/bgh512/Portimao#23-if-portimao-does-not-start-on-a-mac): most problems are solved there in a minute.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw, with any message word for word. A screenshot helps (Cmd + Shift + 4, drag over the message, then drag the picture from the Desktop into this box).
    validations:
      required: true
  - type: textarea
    id: what-tried
    attributes:
      label: What you tried
      description: The entries of the Mac help you tried, and what each one changed.
  - type: textarea
    id: mac-report
    attributes:
      label: The Mac report
      description: Open Terminal (Cmd + Space, type Terminal, press Enter). Type sh and a space, open the Portimao folder, then its launchers folder, drag the file mac_report.sh onto the Terminal window and press Enter. The report is copied by itself, so click here and paste it (Cmd + V). It shows where the Portimao folder is, which includes your Mac user name; change it before sending if you prefer.
      render: text
    validations:
      required: true
